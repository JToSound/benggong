<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>搵唔到頁面 — 《病港》互動地圖</title>
    <style>
      :root {
        --color-primary: #e74c3c;
        --color-accent: #f39c12;
        --color-surface: #1a252f;
        --color-border: #2c3e50;
        --color-text: #ecf0f1;
        --color-text-muted: #95a5a6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
        background: var(--color-surface);
        color: var(--color-text);
        text-align: center;
        padding: 24px;
      }
      main { max-width: 480px; }
      h1 {
        font-size: 4rem;
        margin: 0;
        color: var(--color-primary);
      }
      p { color: var(--color-text); }
      .muted { color: var(--color-text-muted); font-size: 0.9rem; }
      a.btn {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 22px;
        border-radius: 8px;
        background: var(--color-accent);
        color: var(--color-surface);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>你搵嘅頁面唔存在，可能已經搬咗或者從未存在過。</p>
      <p class="muted">喺病港嘅世界入面，迷失好平常——不過呢度可以返屋企。</p>
      <a class="btn" href="./">返《病港》互動地圖主頁</a>
    </main>
  </body>
</html>
